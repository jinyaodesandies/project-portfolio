<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{ page.title }} | Jinyao DeSandies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../styles.css" />
</head>

<body>
  <div class="nav-bar">
    <nav class="nav">
      <a href="../index.html" class="logo">Jinyao DeSandies</a>

      <div class="nav-links">
        <a href="../index.html#research">Research</a>
        <a href="../index.html#projects">Projects</a>
        <a href="../writeups.html">Write-Ups</a>
        <a href="../resume.html">Resume</a>
        <a href="../index.html#contact">Contact</a>
      </div>
    </nav>
  </div>

  <main class="writeup-page-main">
    <section class="writeup-hero-card {{ page.project_class }}">
      <p class="project-number">{{ page.project_number }}</p>

      <h1>{{ page.title }}</h1>

      <p>
        {{ page.description }}
      </p>

      <div class="writeup-page-buttons">
        <a href="../writeups.html" class="button secondary">Back to All Write-Ups</a>
        <a href="../index.html#{{ page.dashboard_id }}" class="button secondary">Back to Dashboard</a>
      </div>
    </section>

    <article class="writeup-article">
      <div class="writeup-body">
        {{ content }}
      </div>
    </article>
  </main>

  <footer class="footer">
    <p>© 2026 Jinyao DeSandies · Pomona College</p>
  </footer>
</body>
</html>
